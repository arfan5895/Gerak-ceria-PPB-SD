  @keyframes ayunA{from{transform:rotate(34deg)}to{transform:rotate(-34deg)}}
  @keyframes ayunB{from{transform:rotate(-34deg)}to{transform:rotate(34deg)}}

  @keyframes putarPenuh{to{transform:rotate(360deg)}}

  @keyframes lemparLengan{0%{transform:rotate(150deg)}35%{transform:rotate(140deg)}60%{transform:rotate(-40deg)}100%{transform:rotate(150deg)}}

  svg.gerak{--spd:1}
  svg.gerak.lambat{--spd:2.2}
  svg.gerak.jeda *{animation-play-state:paused!important}

  .a-sempurna .figur{animation:napas calc(var(--spd)*2.6s) infinite ease-in-out}
  .a-hormat .lgn-ka{animation:hormatLengan calc(var(--spd)*3s) infinite ease-in-out}
  .a-hadap .figur{animation:putarBadan calc(var(--spd)*3.4s) infinite ease-in-out;transform-origin:120px 150px}
  .a-balik .figur{animation:balikBadan calc(var(--spd)*3.6s) infinite ease-in-out;transform-origin:120px 150px}
  .a-lencang .lgn-ka{animation:lencangLengan calc(var(--spd)*3s) infinite ease-in-out}
  .a-jalantempat .kk-ki{animation:lututNaik calc(var(--spd)*.7s) infinite ease-in-out}
  .a-jalantempat .kk-ka{animation:lututNaik calc(var(--spd)*.7s) infinite ease-in-out reverse}

  .a-lempar .lgn-ka{animation:lemparLengan calc(var(--spd)*2s) infinite ease-in-out}
  .a-lempar .bola{animation:bolaLempar calc(var(--spd)*2s) infinite ease-out}
  .a-tendang .kk-ka{animation:tendangKaki calc(var(--spd)*1.8s) infinite ease-in-out}
  .a-tendang .bola{animation:bolaTendang calc(var(--spd)*1.8s) infinite ease-out}

  /* ---------- gambar ---------- */
function kecilkan(berkas){
  return new Promise(ok=>{
    const r = new FileReader();
    r.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maks = 1200; let w = img.width, h = img.height;
        if(w>maks){ h = Math.round(h*maks/w); w = maks; }
        if(h>maks){ w = Math.round(w*maks/h); h = maks; }
        const c = document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        try{ ok(c.toDataURL("image/jpeg",0.78)); }catch(e){ ok(r.result); }
      };
      img.onerror = ()=> ok(null);
      img.src = r.result;
    };
    r.onerror = ()=> ok(null);
    r.readAsDataURL(berkas);
  });
}
function blokGambar(m){
  const g = S.gambar[m.id] || [];
  if(S.fotoAktif >= g.length) S.fotoAktif = 0;
  let h = `<h3 style="margin-top:0">🖼️ Gambar peragaan gerak</h3>`;
  if(g.length===0){
    h += `<p class="catatan">${S.guru
      ? "Belum ada gambar. Unggah foto peragaan gerak dari perangkatmu di bawah ini."
      : "Belum ada gambar untuk pelajaran ini. Lihat animasinya di tab Ayo Lihat, ya!"}</p>`;
  } else {
    h += `<img class="foto-besar" src="${g[S.fotoAktif].src}" alt="Gambar ${esc(m.judul)}">`;
    if(g[S.fotoAktif].judul) h += `<p class="ket-foto">${esc(g[S.fotoAktif].judul)}</p>`;
    if(g.length>1){
      h += `<div class="mini" role="group" aria-label="Pilih gambar">` +
        g.map((x,i)=>`<button data-foto="${i}" aria-pressed="${S.fotoAktif===i}"><img src="${x.src}" alt="Gambar ${i+1}"></button>`).join("") +
        `</div>`;
    }
    if(S.guru) h += `<div class="kendali"><button data-hapusfoto="${S.fotoAktif}">🗑️ Hapus gambar ini</button></div>`;
  }
  if(S.guru){
    h += `<h3>➕ Tambah gambar</h3>
      <div class="kendali"><label class="unggah">📷 Unggah gambar dari perangkat<input type="file" id="unggahgbr" accept="image/*" multiple></label></div>
      <div class="isian"><input id="juduldbr" placeholder="Keterangan gambar (boleh kosong)" autocomplete="off"></div>
      <p class="catatan">Bisa memilih beberapa gambar sekaligus. Gambar otomatis diperkecil agar penyimpanan tidak penuh, dan bisa dilihat tanpa internet.</p>
      <p class="catatan" id="pesangbr"></p>`;
  }
  return h;
}
function pasangGambar(m){
  document.querySelectorAll("[data-foto]").forEach(b=>b.onclick=()=>{ bunyiKlik(); S.fotoAktif = Number(b.dataset.foto); panel(); });
  document.querySelectorAll("[data-hapusfoto]").forEach(b=>b.onclick=async ()=>{
    if(!confirm("Hapus gambar ini?")) return;
    S.gambar[m.id].splice(Number(b.dataset.hapusfoto),1);
    if(!S.gambar[m.id].length) delete S.gambar[m.id];
    S.fotoAktif = 0; await simpan(); panel();
  });
  const ug = document.getElementById("unggahgbr");
  if(ug) ug.onchange = async ()=>{
    const berkas = [...ug.files]; if(!berkas.length) return;
    const judul = (document.getElementById("juduldbr")||{}).value || "";
    const kabar = document.getElementById("pesangbr");
    kabar.textContent = "Sedang memproses gambar...";
    for(const f of berkas){
      const data = await kecilkan(f);
      if(data) (S.gambar[m.id] = S.gambar[m.id] || []).push({src:data, judul:judul.trim()});
    }
    const ok = await simpan();
    S.fotoAktif = (S.gambar[m.id]||[]).length - 1;
    panel();
    if(!ok) document.getElementById("pesangbr").textContent = "Gambar tampil, tetapi penyimpanan perangkat penuh sehingga tidak tersimpan permanen.";
  };
}

<script>

let CARA = "memori";
function bukaDB(){
  return new Promise((ok,gagal)=>{
    if(!window.indexedDB) return gagal();
    const r = indexedDB.open("gerakceria",1);
    r.onupgradeneeded = ()=> r.result.createObjectStore("data");
    r.onsuccess = ()=> ok(r.result);
    r.onerror = ()=> gagal(r.error);
  });
}
function bungkus(){ return {gambar:S.gambar, video:S.video, bintang:S.bintang, selesai:S.selesai}; }
function buka(d){
  if(!d) return;
  if(d.gambar) S.gambar = {...S.gambar, ...d.gambar};
  if(d.video) S.video = {...S.video, ...d.video};
  if(typeof d.bintang === "number") S.bintang = d.bintang;
  if(d.selesai) S.selesai = {...S.selesai, ...d.selesai};
}
async function simpan(){
  try{
    const db = await bukaDB();
    await new Promise((ok,gagal)=>{
      const t = db.transaction("data","readwrite");
      t.objectStore("data").put(bungkus(),"app");
      t.oncomplete = ok; t.onerror = ()=>gagal(t.error);
    });
    CARA = "perangkat"; return true;
  }catch(e){
    try{ localStorage.setItem("gerakceria", JSON.stringify(bungkus())); CARA="perangkat"; return true; }
    catch(e2){ CARA="memori"; return false; }
  }
}
async function muat(){
  if(BAWAAN) buka(BAWAAN);
  try{
    const db = await bukaDB();
    const d = await new Promise((ok,gagal)=>{
      const t = db.transaction("data","readonly");
      const q = t.objectStore("data").get("app");
      q.onsuccess = ()=> ok(q.result); q.onerror = ()=> gagal(q.error);
    });
    buka(d); CARA = "perangkat"; return;
  }catch(e){}
  try{
    const t = localStorage.getItem("gerakceria");
    if(t) buka(JSON.parse(t));
    CARA = "perangkat";
  }catch(e2){ CARA = "memori"; }
}

let BAWAAN = null; /*ISI-BAWAAN*/

   SUARA SEDERHANA
   ======================================================================= */
let audio = null;
function bunyi(nada, panjang){
  if(!S.suara) return;
  try{
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = "triangle"; o.frequency.value = nada;
    g.gain.value = .07;
    o.connect(g); g.connect(audio.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + panjang);
    o.stop(audio.currentTime + panjang);
  }catch(e){}
}
const bunyiBenar = ()=>{ bunyi(660,.12); setTimeout(()=>bunyi(880,.18),110); };
const bunyiSalah = ()=> bunyi(200,.22);
const bunyiKlik  = ()=> bunyi(520,.06);
const bunyiHebat = ()=>{ [523,659,784,1047].forEach((n,i)=> setTimeout(()=>bunyi(n,.16), i*130)); };

function konfeti(){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const w = document.createElement("div");
  w.className = "konfeti";
  const warna = ["#FFC93C","#EF476F","#43C59E","#4FB0F4","#9B5DE5","#FF7A45"];
  for(let i=0;i<40;i++){
    const k = document.createElement("i");
    k.style.left = Math.random()*100 + "%";
    k.style.top = "-20px";
    k.style.background = warna[Math.floor(Math.random()*warna.length)];
    k.style.animationDelay = (Math.random()*.4) + "s";
    w.appendChild(k);
  }
  document.body.appendChild(w);
  setTimeout(()=> w.remove(), 2200);
}

const S = { materi:null, tab:0, jawab:{}, jeda:false, lambat:false, fotoAktif:0,
            gambar:{}, video:{}, bintang:0, selesai:{}, guru:false, suara:true };
const isi = document.getElementById("isi");
const esc = t => String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TAB = ["Apa Itu?","Ayo Lihat","Gambar","Video","Ayo Main","Kuis"];

document.getElementById("btn-suara").onclick = (e)=>{
  S.suara = !S.suara; bunyiKlik();
  e.currentTarget.setAttribute("aria-pressed", S.suara);
  e.currentTarget.textContent = S.suara ? "🔊 Suara" : "🔇 Suara";
};
document.getElementById("btn-guru").onclick = (e)=>{
  S.guru = !S.guru; bunyiKlik();
  e.currentTarget.setAttribute("aria-pressed", S.guru);
  render();
};

function render(){ S.materi!==null ? halamanMateri() : beranda(); window.scrollTo({top:0,behavior:"instant"}); }

/* ---------- beranda ---------- */
function beranda(){
  const jml = Object.keys(S.selesai).length;
  let h = `<div class="sapa">
      <div style="font-size:34px">🐯</div>
      <div class="kata">${jml===0
        ? "Halo, teman! Ayo pilih pelajaran dan bergerak bersama."
        : `Hebat! Kamu sudah menyelesaikan <b>${jml}</b> dari ${MATERI.length} pelajaran.`}</div>
      <div class="bintang-kotak">⭐ ${S.bintang}</div>
    </div>`;

  h += `<div class="judul-bagian">🎒 Pilih Pelajaranmu</div><div class="kisi">`;
  MATERI.forEach((m,i)=>{
    h += `<button class="kartu" data-buka="${i}">
      <span class="ikon" style="background:${m.warna}33">${m.emoji}</span>
      <span>
        <span class="nomor">Pelajaran ${i+1} · ${esc(m.kategori)}</span>
        <span class="jd">${esc(m.judul)}</span>
      </span>
      ${S.selesai[m.id]?`<span class="lencana">${STIKER[i]}</span>`:""}
    </button>`;
  });
  h += `</div>`;

  h += `<div class="judul-bagian">🏆 Koleksi Stikermu</div>
    <div class="stiker">` +
    MATERI.map((m,i)=> S.selesai[m.id]
      ? `<span title="${esc(m.judul)}">${STIKER[i]}</span>`
      : `<span class="kunci" title="Selesaikan kuis untuk membukanya">🔒</span>`).join("") +
    `</div>
    <p class="catatan" style="margin-top:10px">Selesaikan kuis di setiap pelajaran untuk mengumpulkan stiker.</p>`;

  if(S.guru){
    h += `<div class="judul-bagian">👩‍🏫 Menu Guru</div>
      <div class="panel">
        <p class="catatan" style="margin:0 0 10px">Buka tab <b>Gambar</b> untuk mengunggah foto peragaan gerak, dan tab <b>Video</b> untuk mengunggah video atau menempel tautan YouTube. Semuanya tersimpan di perangkat ini dan tetap ada setelah aplikasi ditutup.</p>
        <div class="kendali">
          <button class="hijau" id="ekspor">💾 Unduh aplikasi siap dibagikan</button>
          <button id="hapusvideo">🗑️ Hapus semua gambar & video</button>
          <button id="nolbintang">↺ Atur ulang bintang siswa</button>
        </div>
        <p class="catatan" id="pesanguru" style="margin-top:8px"></p>
      </div>`;
  }

  h += `<footer>Gerak Ceria · Media belajar PJOK untuk kelas 1–3<br>UPT SPF SDN Rappocini</footer>`;
  isi.innerHTML = h;

  isi.querySelectorAll("[data-buka]").forEach(b=>b.onclick=()=>{
    bunyiKlik(); S.materi = Number(b.dataset.buka); S.tab = 0; S.jawab = {}; render();
  });
  pasangMenuGuru();
}

function pasangMenuGuru(){
  const e = document.getElementById("ekspor");
  if(e) e.onclick = ()=>{
    const kabar = document.getElementById("pesanguru");
    try{
      const data = JSON.stringify({gambar:S.gambar, video:S.video}).replace(/<\//g,"<\\/");
      let sumber = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      sumber = sumber.replace(/(<main[^>]*id="isi"[^>]*>)[\s\S]*?(<\/main>)/, "$1$2");
      const tanda = "let BAWAAN = null; /*ISI-BAWAAN*/";
      if(sumber.indexOf(tanda) === -1){ kabar.textContent = "Penanda tidak ditemukan pada berkas ini."; return; }
      sumber = sumber.replace(tanda, "let BAWAAN = " + data + "; /*ISI-BAWAAN*/");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([sumber],{type:"text/html"}));
      a.download = "gerak-ceria-siap-dibagikan.html";
      a.click(); URL.revokeObjectURL(a.href);
      kabar.textContent = `Berhasil diunduh (sekitar ${(sumber.length/1048576).toFixed(1)} MB). Berkas ini sudah berisi video yang kamu tambahkan.`;
    }catch(err){ kabar.textContent = "Gagal membuat salinan: " + err.message; }
  };
  const hv = document.getElementById("hapusvideo");
  if(hv) hv.onclick = async ()=>{
    if(!confirm("Hapus semua gambar dan video di aplikasi ini?")) return;
    S.gambar = {}; S.video = {}; await simpan(); beranda();
  };
  const nb = document.getElementById("nolbintang");
  if(nb) nb.onclick = async ()=>{
    if(!confirm("Atur ulang bintang dan stiker siswa?")) return;
    S.bintang = 0; S.selesai = {}; await simpan(); beranda();
  };
}

/* ---------- halaman materi ---------- */
function halamanMateri(){
  const m = MATERI[S.materi];
  let h = `<button class="balik" id="balik">← Kembali</button>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
      <div style="width:56px;height:56px;border-radius:18px;background:${m.warna}33;display:grid;place-items:center;font-size:30px">${m.emoji}</div>
      <div><div class="catatan" style="font-size:13px">Pelajaran ${S.materi+1} · ${esc(m.kategori)}</div>
      <h2 style="margin:0">${esc(m.judul)}</h2></div>
    </div>
    <div class="tab" role="group" aria-label="Bagian pelajaran">`;
  TAB.forEach((t,i)=> h += `<button data-tab="${i}" aria-pressed="${S.tab===i}">${t}</button>`);
  h += `</div><div class="panel" id="panel"></div>`;
  isi.innerHTML = h;

  document.getElementById("balik").onclick = ()=>{ bunyiKlik(); S.materi=null; render(); };
  isi.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{
    bunyiKlik(); S.tab = Number(b.dataset.tab);
    isi.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-pressed", Number(x.dataset.tab)===S.tab));
    panel();
  });
  panel();
}

function panel(){
  const m = MATERI[S.materi], p = document.getElementById("panel");
  if(S.tab===0){
    p.innerHTML = `<h3 style="margin-top:0">📖 Apa itu?</h3>
      <div class="kotak-def">${esc(m.def)}</div>
      <h3>🎯 Tujuan Belajar</h3>
      <ul class="rapi">${m.tujuan.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  } else if(S.tab===1){
    p.innerHTML = `<h3 style="margin-top:0">👀 Lihat gerakannya</h3>
      <div class="panggung">${svgGerak(m.anim)}<p class="ket">${esc(m.ket)}</p></div>
      <div class="kendali">
        <button id="jeda" aria-pressed="${S.jeda}">${S.jeda?"▶️ Putar":"⏸️ Berhenti"}</button>
        <button id="lambat" aria-pressed="${S.lambat}">🐌 Gerak lambat</button>
      </div>
      <h3>👣 Ayo lakukan</h3>
      <ol class="langkah">${m.langkah.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`;
    pasangKendali();
  } else if(S.tab===2){
    p.innerHTML = blokGambar(m);
    pasangGambar(m);
  } else if(S.tab===3){
    p.innerHTML = blokVideo(m);
    pasangVideo(m);
  } else if(S.tab===4){
    p.innerHTML = `<h3 style="margin-top:0">🎉 Ayo main bersama</h3>` +
      m.main.map(x=>`<div class="main"><b>${esc(x.n)}</b>${esc(x.d)}</div>`).join("");
  } else kuis(p,m);
}

function pasangKendali(){
  const svg = document.querySelector("svg.gerak"); if(!svg) return;
  svg.classList.toggle("jeda",S.jeda); svg.classList.toggle("lambat",S.lambat);
  const j = document.getElementById("jeda"), l = document.getElementById("lambat");
  j.onclick = ()=>{ bunyiKlik(); S.jeda=!S.jeda; svg.classList.toggle("jeda",S.jeda);
    j.textContent = S.jeda?"▶️ Putar":"⏸️ Berhenti"; j.setAttribute("aria-pressed",S.jeda); };
  l.onclick = ()=>{ bunyiKlik(); S.lambat=!S.lambat; svg.classList.toggle("lambat",S.lambat);
    l.setAttribute("aria-pressed",S.lambat); };
}

/* ---------- gambar ---------- */
function kecilkan(berkas){
  return new Promise(ok=>{
    const r = new FileReader();
    r.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maks = 1200; let w = img.width, h = img.height;
        if(w>maks){ h = Math.round(h*maks/w); w = maks; }
        if(h>maks){ w = Math.round(w*maks/h); h = maks; }
        const c = document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        try{ ok(c.toDataURL("image/jpeg",0.78)); }catch(e){ ok(r.result); }
      };
      img.onerror = ()=> ok(null);
      img.src = r.result;
    };
    r.onerror = ()=> ok(null);
    r.readAsDataURL(berkas);
  });
}
function blokGambar(m){
  const g = S.gambar[m.id] || [];
  if(S.fotoAktif >= g.length) S.fotoAktif = 0;
  let h = `<h3 style="margin-top:0">🖼️ Gambar peragaan gerak</h3>`;
  if(g.length===0){
    h += `<p class="catatan">${S.guru
      ? "Belum ada gambar. Unggah foto peragaan gerak dari perangkatmu di bawah ini."
      : "Belum ada gambar untuk pelajaran ini. Lihat animasinya di tab Ayo Lihat, ya!"}</p>`;
  } else {
    h += `<img class="foto-besar" src="${g[S.fotoAktif].src}" alt="Gambar ${esc(m.judul)}">`;
    if(g[S.fotoAktif].judul) h += `<p class="ket-foto">${esc(g[S.fotoAktif].judul)}</p>`;
    if(g.length>1){
      h += `<div class="mini" role="group" aria-label="Pilih gambar">` +
        g.map((x,i)=>`<button data-foto="${i}" aria-pressed="${S.fotoAktif===i}"><img src="${x.src}" alt="Gambar ${i+1}"></button>`).join("") +
        `</div>`;
    }
    if(S.guru) h += `<div class="kendali"><button data-hapusfoto="${S.fotoAktif}">🗑️ Hapus gambar ini</button></div>`;
  }
  if(S.guru){
    h += `<h3>➕ Tambah gambar</h3>
      <div class="kendali"><label class="unggah">📷 Unggah gambar dari perangkat<input type="file" id="unggahgbr" accept="image/*" multiple></label></div>
      <div class="isian"><input id="juduldbr" placeholder="Keterangan gambar (boleh kosong)" autocomplete="off"></div>
      <p class="catatan">Bisa memilih beberapa gambar sekaligus. Gambar otomatis diperkecil agar penyimpanan tidak penuh, dan bisa dilihat tanpa internet.</p>
      <p class="catatan" id="pesangbr"></p>`;
  }
  return h;
}
function pasangGambar(m){
  document.querySelectorAll("[data-foto]").forEach(b=>b.onclick=()=>{ bunyiKlik(); S.fotoAktif = Number(b.dataset.foto); panel(); });
  document.querySelectorAll("[data-hapusfoto]").forEach(b=>b.onclick=async ()=>{
    if(!confirm("Hapus gambar ini?")) return;
    S.gambar[m.id].splice(Number(b.dataset.hapusfoto),1);
    if(!S.gambar[m.id].length) delete S.gambar[m.id];
    S.fotoAktif = 0; await simpan(); panel();
  });
  const ug = document.getElementById("unggahgbr");
  if(ug) ug.onchange = async ()=>{
    const berkas = [...ug.files]; if(!berkas.length) return;
    const judul = (document.getElementById("juduldbr")||{}).value || "";
    const kabar = document.getElementById("pesangbr");
    kabar.textContent = "Sedang memproses gambar...";
    for(const f of berkas){
      const data = await kecilkan(f);
      if(data) (S.gambar[m.id] = S.gambar[m.id] || []).push({src:data, judul:judul.trim()});
    }
    const ok = await simpan();
    S.fotoAktif = (S.gambar[m.id]||[]).length - 1;
    panel();
    if(!ok) document.getElementById("pesangbr").textContent = "Gambar tampil, tetapi penyimpanan perangkat penuh sehingga tidak tersimpan permanen.";
  };
}

/* ---------- video ---------- */
function idYoutube(url){
  const m = String(url).match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
function blokVideo(m){
  const v = S.video[m.id] || [];
  let h = `<h3 style="margin-top:0">🎬 Video belajar</h3>`;
  if(v.length===0){
    h += `<p class="catatan">${S.guru
      ? "Belum ada video. Tambahkan video dari perangkat atau tempel tautan YouTube di bawah ini."
      : "Belum ada video untuk pelajaran ini. Lihat gerakannya di tab Ayo Lihat, ya!"}</p>`;
  }
  v.forEach((x,i)=>{
    h += `<div class="main"><b>${esc(x.judul || (x.jenis==="youtube"?"Video YouTube":"Video"))}</b>`;
    h += x.jenis==="youtube"
      ? `<div class="bingkai"><iframe src="https://www.youtube.com/embed/${x.id}" title="Video pembelajaran" allowfullscreen loading="lazy"></iframe></div>
         <p class="catatan" style="margin:8px 0 0">Video YouTube memerlukan internet.</p>`
      : `<video class="video" src="${x.src}" controls playsinline preload="metadata"></video>`;
    if(S.guru) h += `<div class="kendali"><button data-hapusvid="${i}">🗑️ Hapus video ini</button></div>`;
    h += `</div>`;
  });
  if(S.guru){
    h += `<h3>➕ Tambah video</h3>
      <div class="kendali"><label class="unggah">📁 Unggah video dari perangkat<input type="file" id="unggahvid" accept="video/*"></label></div>
      <p class="catatan">Ukuran video sebaiknya di bawah 25 MB agar penyimpanan tidak penuh. Video unggahan bisa diputar tanpa internet.</p>
      <div class="isian">
        <input id="tautan" placeholder="Tempel tautan YouTube di sini" autocomplete="off">
        <input id="judulvid" placeholder="Judul video (boleh kosong)" autocomplete="off">
      </div>
      <div class="kendali"><button class="biru" id="tambahtautan">🔗 Tambah tautan YouTube</button></div>
      <p class="catatan" id="pesanvid"></p>`;
  }
  return h;
}
function pasangVideo(m){
  document.querySelectorAll("[data-hapusvid]").forEach(b=>b.onclick=async ()=>{
    if(!confirm("Hapus video ini?")) return;
    S.video[m.id].splice(Number(b.dataset.hapusvid),1);
    if(!S.video[m.id].length) delete S.video[m.id];
    await simpan(); panel();
  });
  const uv = document.getElementById("unggahvid");
  if(uv) uv.onchange = ()=>{
    const f = uv.files[0]; if(!f) return;
    const kabar = document.getElementById("pesanvid");
    if(f.size > 25*1024*1024){ kabar.textContent = "Video terlalu besar (lebih dari 25 MB). Perpendek durasinya dulu."; return; }
    kabar.textContent = "Sedang memproses video...";
    const r = new FileReader();
    r.onload = async ()=>{
      (S.video[m.id] = S.video[m.id] || []).push({jenis:"berkas", src:r.result, judul:f.name.replace(/\.[^.]+$/,"")});
      const ok = await simpan(); panel();
      if(!ok) document.getElementById("pesanvid").textContent = "Video tampil, tetapi penyimpanan perangkat penuh sehingga tidak tersimpan permanen.";
    };
    r.onerror = ()=>{ kabar.textContent = "Video gagal dibaca."; };
    r.readAsDataURL(f);
  };
  const tt = document.getElementById("tambahtautan");
  if(tt) tt.onclick = async ()=>{
    const url = document.getElementById("tautan").value.trim();
    const judul = document.getElementById("judulvid").value.trim();
    const id = idYoutube(url);
    if(!id){ document.getElementById("pesanvid").textContent = "Tautan belum benar. Salin tautan lengkap dari YouTube."; return; }
    (S.video[m.id] = S.video[m.id] || []).push({jenis:"youtube", id, judul});
    await simpan(); panel();
  };
}

/* ---------- kuis ---------- */
function kuis(p,m){
  const huruf = ["A","B","C","D"];
  let h = `<h3 style="margin-top:0">🧠 Ayo jawab</h3>
    <p class="catatan">Pilih satu jawaban. Kalau salah, tidak apa-apa, coba lagi ya!</p>`;
  m.kuis.forEach((q,i)=>{
    h += `<div class="soal"><div class="no">Soal ${i+1} dari ${m.kuis.length}</div>
      <div class="tanya">${esc(q.s)}</div>`;
    q.o.forEach((o,j)=>{
      const dijawab = S.jawab[i]!==undefined;
      let kelas = "pilihan";
      if(dijawab && j===q.a) kelas += " benar";
      else if(dijawab && j===S.jawab[i]) kelas += " salah";
      h += `<button class="${kelas}" data-s="${i}" data-o="${j}" ${dijawab?"disabled":""}>
        <span class="huruf">${huruf[j]}</span><span>${esc(o)}</span></button>`;
    });
    if(S.jawab[i]!==undefined){
      const tepat = S.jawab[i]===q.a;
      h += `<div class="bahas">${tepat?"🎉 ":"💪 Belum tepat. "}${esc(q.x)}</div>`;
    }
    h += `</div>`;
  });
  const selesai = Object.keys(S.jawab).length === m.kuis.length;
  if(selesai){
    const benar = m.kuis.filter((q,i)=>S.jawab[i]===q.a).length;
    const wajah = benar===m.kuis.length ? "🤩" : benar>=2 ? "😀" : "🙂";
    h += `<div class="skor"><div class="wajah">${wajah}</div>
      <div class="angka">${benar} dari ${m.kuis.length}</div>
      <p style="margin:4px 0 0">${benar===m.kuis.length?"Sempurna! Kamu hebat sekali!":"Bagus! Ayo coba lagi supaya makin pintar."}</p></div>
      <div class="kendali"><button id="ulang">🔁 Kerjakan lagi</button>
      <button class="biru" id="pulang">🏠 Pilih pelajaran lain</button></div>`;
  }
  p.innerHTML = h;

  p.querySelectorAll("[data-s]").forEach(b=>b.onclick=async ()=>{
    const i = Number(b.dataset.s), j = Number(b.dataset.o);
    S.jawab[i] = j;
    const tepat = j === m.kuis[i].a;
    if(tepat){ bunyiBenar(); konfeti(); } else bunyiSalah();
    if(Object.keys(S.jawab).length === m.kuis.length){
      const benar = m.kuis.filter((q,k)=>S.jawab[k]===q.a).length;
      if(!S.selesai[m.id]){ S.selesai[m.id] = true; S.bintang += benar; await simpan(); bunyiHebat(); }
    }
    kuis(p,m);
  });
  const u = document.getElementById("ulang");
  if(u) u.onclick = ()=>{ bunyiKlik(); S.jawab = {}; kuis(p,m); };
  const pl = document.getElementById("pulang");
  if(pl) pl.onclick = ()=>{ bunyiKlik(); S.materi = null; S.jawab = {}; render(); };
}

muat().then(render, render);
</script>
